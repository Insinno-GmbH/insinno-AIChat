# Render deployment config — committed to git, not blocked by .dockerignore.
# Set in Render env vars: CONFIG_PATH=/app/config/render.yaml
# API keys are injected at runtime from Render env vars (${VAR} syntax).

version: "1.3.13"
cache: true

interface:
  privacyPolicy:
    externalUrl: "https://insinno.de"
    openNewTab: true
  termsOfService:
    externalUrl: "https://insinno.de"
    openNewTab: true

# Beispiel-Endpunkte (Passe diese an deine genutzten LLMs an)
endpoints:
  custom:
    - name: "OpenAI"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://openai.com"
      models:
        default: ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo"]
        fetch: false
      titleConvo: true
      summarize: true
      # Icon-Zuweisung passend zum Unternehmens-Design
      iconURL: "https://insinno.de"
    - name: "DSGVO AI"
      apiKey: "${IONOS_API_KEY}"
      baseURL: "https://openai.inference.de-txl.ionos.com/v1"
      models:
        default:
          - "mistralai/Mistral-Small-24B-Instruct"
          - "Qwen/Qwen3.5-9B"
          - "meta-llama/Meta-Llama-3.1-8B-Instruct"
          - "meta-llama/Meta-Llama-3.1-405B-Instruct-FP8"
          - "Qwen/Qwen3.5-397B-A17B"
        fetch: false
      titleConvo: true
      summarize: true
    - name: "AI Text2Image"
      apiKey: "${IONOS_API_KEY}"
      baseURL: "https://openai.inference.de-txl.ionos.com/v1"
      models:
        default:
          - "black-forest-labs/FLUX.1-schnell"
          - "black-forest-labs/FLUX.2-klein-4B"
        fetch: false
      titleConvo: true
      summarize: true

fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 52428800
