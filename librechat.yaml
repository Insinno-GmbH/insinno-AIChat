# LibreChat Konfigurationsversion (Aktuellste Version)
version: "1.3.13"

# Globale Einstellungen f�r das Insinno-Branding
interface:
  privacyPolicy:
    externalUrl: "https://www.pwc.com"
    openInNewTab: true
  termsOfService:
    externalUrl: "https://www.pwc.com"
    openInNewTab: true

# Beispiel-Endpunkte (Passe diese an deine genutzten LLMs an)
endpoints:
  custom:
    - name: "OpenAI"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://openai.com"
      models:
        default: ["gpt-6-sol", "gpt-6-luna", "gpt-6-astra"]
        fetch: false
      titleConvo: true
      summarize: true
      # Icon-Zuweisung passend zum Unternehmens-Design
      iconURL: "https://www.pwc.com"

  agents:
    capabilities:
      - execute_code
      - web_search
      - artifacts
      - context
      - skills
      - tools
      - actions
      - file_search  # Enables the Agent Builder's File Search option
    
    

# Datei-Management-Einstellungen (Verhindert Fehler bei Uploads)
fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 52428800 # 50 MB
