# LibreChat Konfigurationsversion (Aktuellste Version)
version: "1.3.13"

# Globale Einstellungen f�r das Insinno-Branding
interface:
  privacyPolicy:
    externalUrl: "https://insinno.de"
    openInNewTab: true
  termsOfService:
    externalUrl: "https://insinno.de"
    openInNewTab: true

# Kundenspezifische Benutzeroberfl�che im Insinno-Stil
customation:
  appName: "insinno iCore AI"
  appTitle: "insinno AI Portal"
  # Offizielle Insinno Farbpalette (Orange-Akzente auf dunklem/hellem Grund)
  brandColors:
    primary: "#FF6B00"       # Das typische insinno-Orange
    secondary: "#000000"     # Klassisch Schwarz f�r Schriftz�ge/Header
  # Optionale Links f�r das Dashboard/Hilfe-Men�
  helpLink: "https://insinno.de"

# Beispiel-Endpunkte (Passe diese an deine genutzten LLMs an)
endpoints:
  custom:
    - name: "OpenAI"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://openai.com"
      models:
        default: ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo"]
        fetch: false
      titleConvo: true
      summarize: true
      # Icon-Zuweisung passend zum Unternehmens-Design
      iconURL: "https://insinno.de"
    - name: "DSGVO AI"
      apiKey: "${IONOS_API_KEY}"
      baseURL: "https://openai.inference.de-txl.ionos.com/v1"
      models:
        default:
          - "mistralai/Mistral-Small-24B-Instruct"
          - "Qwen/Qwen3.5-9B"
          - "meta-llama/Meta-Llama-3.1-8B-Instruct"
          - "meta-llama/Meta-Llama-3.1-405B-Instruct-FP8"
          - "Qwen/Qwen3.5-397B-A17B"
        fetch: false
      titleConvo: true
      summarize: true
    - name: "AI Text2Image"
      apiKey: "${IONOS_API_KEY}"
      baseURL: "https://openai.inference.de-txl.ionos.com/v1"
      models:
        default:
          - "black-forest-labs/FLUX.1-schnell"
          - "black-forest-labs/FLUX.2-klein-4B"
        fetch: false
      titleConvo: true
      summarize: true

# Datei-Management-Einstellungen (Verhindert Fehler bei Uploads)
fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 52428800 # 50 MB
